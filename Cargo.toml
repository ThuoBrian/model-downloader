[package]
name = "model-downloader"
version = "0.6.0"
edition = "2024"
rust-version = "1.95"
description = "Desktop app to download open-weights reasoning models (GGUF) on Windows or macOS"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow"] }
# For the ✔ ⚠ ✖ glyphs; eframe doesn't re-export this feature.
egui = { version = "0.37", default-features = false, features = ["monochrome_emoji_fonts"] }
rfd = "0.18"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "fs", "io-util", "macros", "sync"] }
serde = { version = "1", features = ["derive"] }
anyhow = "1"
futures-util = "0.3"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_WindowsProgramming"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

[build-dependencies]
embed-resource = "3.0.12"

# Checksumming multi-GB files is painfully slow unoptimized; keep debug builds usable.
[profile.dev.package.sha2]
opt-level = 3
